# Fail2Ban filter for Mohideen API — install at /etc/fail2ban/filter.d/mohideen.conf
# Then add the jail below to /etc/fail2ban/jail.local

[INCLUDES]
before = common.conf

[Definition]
# Match 429 (rate limit hit) and 401 (bad token) responses in Nginx access log
failregex = ^<HOST> .+ "(POST|GET) /auth/.+ HTTP/.+" (401|429) .+$
            ^<HOST> .+ "(POST|GET) /upload/.+ HTTP/.+" 429 .+$
ignoreregex =

# ── jail.local entry (append to /etc/fail2ban/jail.local) ────────────────────
# [mohideen-api]
# enabled  = true
# filter   = mohideen
# logpath  = /var/log/nginx/access.log
# maxretry = 10
# findtime = 600
# bantime  = 3600
# action   = iptables-multiport[name=mohideen, port="http,https"]
