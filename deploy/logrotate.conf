# Install: sudo cp logrotate.conf /etc/logrotate.d/mohideen

/app/logs/*.log /var/log/nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        # Reload nginx after log rotation
        nginx -s reopen 2>/dev/null || true
        # Send USR1 to gunicorn to reopen log files
        kill -USR1 $(cat /run/mohideen.pid 2>/dev/null) 2>/dev/null || true
    endscript
}
