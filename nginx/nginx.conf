user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # ── Security ──────────────────────────────────────────────────────────────
    server_tokens off;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml
        image/svg+xml
        font/woff2;

    # ── Rate limiting zones (IP-based) ────────────────────────────────────────
    # Auth endpoints — strict
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
    # OTP endpoints — very strict
    limit_req_zone $binary_remote_addr zone=otp:10m     rate=3r/m;
    # File uploads
    limit_req_zone $binary_remote_addr zone=upload:10m  rate=20r/m;
    # General API
    limit_req_zone $binary_remote_addr zone=api:10m     rate=100r/m;
    # Admin API
    limit_req_zone $binary_remote_addr zone=admin:10m   rate=300r/m;

    limit_req_status 429;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream fastapi {
        server api:8000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
