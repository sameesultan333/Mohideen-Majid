# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_HERE;   # replace before go-live

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                                 always;
    add_header X-Content-Type-Options    "nosniff"                                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"            always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self' 'unsafe-inline'; "
        "style-src 'self' 'unsafe-inline'; "
        "img-src 'self' data: blob: https:; "
        "connect-src 'self' wss:; "
        "font-src 'self'; "
        "object-src 'none'; "
        "frame-ancestors 'self';"
        always;

    # ── Uploads (static, served directly by Nginx) ───────────────────────────
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        # Prevent execution of uploaded files — serve as download if not image
        location ~* \.(php|py|pl|sh|exe|bat|cmd)$ {
            deny all;
        }
    }

    # ── Auth endpoints — strict rate limiting ─────────────────────────────────
    location ~ ^/auth/(request-login-otp|verify-login-otp|resend-otp|register) {
        limit_req zone=otp burst=5 nodelay;
        proxy_pass http://fastapi;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location ~ ^/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://fastapi;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── File upload ───────────────────────────────────────────────────────────
    location ~ ^/upload/ {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 20M;
        proxy_pass http://fastapi;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Admin API ─────────────────────────────────────────────────────────────
    location ~ ^/(admin|audit|staff|finance|chanda|expenses|donations|funds|payments)/ {
        limit_req zone=admin burst=50 nodelay;
        proxy_pass http://fastapi;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://fastapi;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── General API ───────────────────────────────────────────────────────────
    location / {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://fastapi;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
