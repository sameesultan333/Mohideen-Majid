buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        kotlinVersion = "1.9.10"
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath 'com.google.gms:google-services:4.3.15'
    }
}

plugins {
    id("com.facebook.react") apply false
}

allprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "11"
        }
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

gradle.beforeProject { project ->
    project.buildscript.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.bouncycastle') {
                def name = details.requested.name.replace('jdk18on', 'jdk15on').replace('jdk15to18', 'jdk15on')
                details.useTarget group: 'org.bouncycastle', name: name, version: '1.70'
            }
        }
    }
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.facebook.react' && details.requested.name == 'react-native') {
                details.useTarget group: 'com.facebook.react', name: 'react-android', version: '0.72.6'
            }
            if (details.requested.group == 'org.bouncycastle') {
                def name = details.requested.name.replace('jdk18on', 'jdk15on').replace('jdk15to18', 'jdk15on')
                details.useTarget group: 'org.bouncycastle', name: name, version: '1.70'
            }
            def group = details.requested.group
            if (group == 'androidx.appcompat') { details.useVersion '1.6.1' }
            else if (group == 'androidx.fragment') { details.useVersion '1.6.2' }
            else if (group == 'androidx.activity') { details.useVersion '1.7.2' }
            else if (group == 'androidx.media3') { details.useVersion '1.1.1' }
            else if (group == 'androidx.transition') { details.useVersion '1.4.1' }
            else if (group == 'androidx.dynamicanimation') { details.useVersion '1.0.0' }
            else if (group == 'androidx.media') { details.useVersion '1.6.0' }
            else if (group == 'androidx.core') { details.useVersion '1.9.0' }
            else if (group == 'androidx.annotation' && details.requested.name == 'annotation-experimental') { details.useVersion '1.3.0' }
            else if (group == 'com.google.android.material') { details.useVersion '1.9.0' }
            else if (group == 'androidx.graphics' && details.requested.name.startsWith('graphics-shapes')) { details.useVersion '1.0.0-alpha01' }
        }
    }
}

subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        def androidExtension = subproject.extensions.findByName('android')
        if (androidExtension != null) {
            if (androidExtension.hasProperty('buildFeatures') && androidExtension.buildFeatures != null) {
                androidExtension.buildFeatures.buildConfig = true
            }
            if (!androidExtension.hasProperty('namespace') || androidExtension.namespace == null || androidExtension.namespace.toString().trim().isEmpty()) {
                def manifestFile = subproject.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def manifestPackage = new XmlSlurper(false, false).parse(manifestFile).@package?.text()
                    if (manifestPackage) {
                        androidExtension.namespace = manifestPackage
                    }
                }
            }
        }
    }
}
